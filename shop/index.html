<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room 321</title>
<script defer src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#161616;--muted:#77777d;--line:#e8e8e4;--accent:#161616;--on:#fff;--ok:#1f9d55;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111112;--card:#1b1b1d;--text:#f2f2f0;--muted:#92929a;--line:#2a2a2d;--accent:#f2f2f0;--on:#111;--ok:#4cc57d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111112;--card:#1b1b1d;--text:#f2f2f0;--muted:#92929a;--line:#2a2a2d;--accent:#f2f2f0;--on:#111;--ok:#4cc57d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"PingFang HK","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:28px 18px 130px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:30px;letter-spacing:-.02em;margin:0 0 4px}
.lang{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{padding:5px 10px;border-radius:999px;background:transparent;font-size:13px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--accent);color:var(--on)}
.sub{color:var(--muted);margin:0 0 20px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.emoji{font-size:30px;width:52px;height:52px;display:grid;place-items:center;background:var(--bg);border-radius:14px;flex:none}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.info b{font-weight:600}.info span{color:var(--muted);font-size:13px}.info em{font-style:normal;font-weight:600;margin-top:2px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.add{background:var(--accent);color:var(--on);border-radius:999px;padding:8px 18px;font-weight:600}
.step{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.step button{width:32px;height:32px;border-radius:50%;background:var(--card);font-size:18px;line-height:1}
.step span{min-width:22px;text-align:center;font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center}
#bar button{width:100%;max-width:484px;background:var(--accent);color:var(--on);border-radius:16px;padding:16px 20px;font-weight:600;display:flex;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#ov,#sc{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#ov[hidden],#bar[hidden],#sc[hidden],#toast[hidden],.btn[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 14px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.x{background:var(--card);width:32px;height:32px;border-radius:50%;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.row span:last-child,.row b:last-child{text-align:right}
.row.t{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:700;font-size:18px}
label.l{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;resize:none}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border-radius:12px;background:var(--bg);font-weight:600;font-size:14px}
.tabs button.on{background:var(--accent);color:var(--on)}
.pay p{margin:0 0 10px}.pay img{width:220px;max-width:100%;border-radius:12px;display:block;margin:0 auto 10px;background:#fff}
.btn{display:block;width:100%;text-align:center;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:600;margin-bottom:8px}
.btn.p{background:var(--ok);color:#fff;border-color:transparent}
.hint{color:var(--muted);font-size:13px;margin:4px 0 10px}
.msg{white-space:pre-wrap;font-size:14px;color:var(--muted);margin-bottom:10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.scan{width:100%;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;margin:0 0 18px}
#vid{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover;margin-bottom:10px}
.manrow{display:flex;gap:8px;align-items:flex-start}.manrow input{margin:0}
.two{display:flex;gap:8px}.two .btn{flex:1;margin-bottom:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--on);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;font-size:14px;z-index:15;box-shadow:0 8px 24px rgba(0,0,0,.2);width:max-content;max-width:calc(100% - 36px)}
#toast button{background:transparent;color:inherit;text-decoration:underline;font-weight:600;white-space:nowrap}
.flash{animation:fl 1.6s}@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--ok)}100%{box-shadow:0 0 0 3px transparent}}
.rc{text-align:center;margin-bottom:10px}.rc h2{justify-content:center;margin:8px 0 4px}
.tick{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;display:grid;place-items:center;margin:0 auto}

/* ===== polish & motion ===== */
body{background:radial-gradient(900px 360px at 50% -120px,rgba(31,157,85,.13),transparent 70%),var(--bg);background-attachment:fixed}
h1{font-size:32px;font-weight:750}
button,.btn,input,textarea{transition:transform .15s ease,background .2s,opacity .2s,box-shadow .2s,border-color .2s}
button:active,.btn:active{transform:scale(.96)}
.item{box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 20px -12px rgba(0,0,0,.18);transition:transform .2s,box-shadow .2s}
.item:active{transform:scale(.985)}
.emoji{background:linear-gradient(145deg,var(--bg),var(--line))}
.info em{display:inline-block;align-self:flex-start;margin-top:5px;font-size:14px;background:var(--bg);padding:1px 10px;border-radius:999px}
.enter{opacity:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
#bar:not([hidden]) button{animation:up .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(120%);opacity:0}to{transform:none;opacity:1}}
#ov:not([hidden]),#sc:not([hidden]){animation:fade .25s ease}
#ov:not([hidden]) .sheet,#sc:not([hidden]) .sheet{animation:sheet .4s cubic-bezier(.2,.9,.25,1)}
@keyframes fade{from{opacity:0}}
@keyframes sheet{from{transform:translateY(70px);opacity:0}}
.sheet{box-shadow:0 -20px 60px rgba(0,0,0,.2)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--muted);opacity:.35;margin:-10px auto 16px}
input:focus,textarea:focus{outline:none;border-color:var(--muted);box-shadow:0 0 0 4px rgba(128,128,128,.15)}
.tabs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{border-radius:10px}
.fade{animation:fade .35s ease}
.shake{animation:shake .4s;border-color:#e5484d!important}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.err{color:#e5484d;font-size:13px;margin:-8px 0 12px}.err[hidden]{display:none}
.req{color:#e5484d}
.lock{opacity:.5}
.tick{box-shadow:0 0 0 0 rgba(31,157,85,.5);animation:tick .6s cubic-bezier(.3,1.6,.5,1),ring 1.2s .4s ease-out}
@keyframes tick{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
@keyframes ring{to{box-shadow:0 0 0 24px rgba(31,157,85,0)}}
.rc~.card{animation:rise .5s .15s both cubic-bezier(.2,.8,.2,1)}
.rc~.card~.card{animation-delay:.3s}
#toast:not([hidden]){animation:toast .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
#fin:not([hidden]){animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.enter{opacity:1}}

/* ===== receipt ===== */
.rwrap{filter:drop-shadow(0 10px 20px rgba(0,0,0,.22));margin:6px 4px 18px;animation:printout 1.2s cubic-bezier(.3,.7,.2,1) both}
@keyframes printout{from{clip-path:inset(-20px -20px 100% -20px)}to{clip-path:inset(-20px -20px -30px -20px)}}
.paper{background:#fffdf7;color:#222;font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;padding:22px 20px 32px;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%}
.rh{text-align:center}.shop{font-size:21px;font-weight:700;letter-spacing:.14em}.rt{letter-spacing:.22em;font-size:12px;margin-top:2px;color:#555}
.paper .dash{border-top:2px dashed #b9b4a6;margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:14px;padding:1px 0}.kv span{color:#666}.kv b{font-weight:600;text-align:right;word-break:break-word}
.li{display:flex;justify-content:space-between;gap:12px;margin-top:6px}.li b{white-space:nowrap;font-weight:600}
.lsub{color:#777;font-size:12px;padding-left:12px}
.kv.tot{font-size:18px;margin-top:4px}.kv.tot span{color:#222;font-weight:700}.kv.tot b{font-weight:800}
.bars{height:44px;margin:14px auto 4px;width:82%;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px,#222 8px 11px,transparent 11px 13px,#222 13px 14px,transparent 14px 16px)}
.bref{text-align:center;letter-spacing:.3em;font-size:12px;color:#555}
.thx{text-align:center;font-weight:700;margin-top:14px;font-size:15px}
.fine{text-align:center;color:#777;font-size:11.5px;margin-top:4px}

/* ===== round 6 ===== */
.btn.dark{background:var(--accent);color:var(--on);border-color:transparent}
.tabs{background:none;border:0;padding:0;gap:8px}
.tabs button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--text);border-color:var(--text)}
.tools{display:flex;gap:8px;margin-bottom:18px}.tools .scan{margin:0;flex:1}
.hcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;animation:rise .4s both cubic-bezier(.2,.8,.2,1)}
.hrow{display:flex;justify-content:space-between;font-size:16px}.hsub{color:var(--muted);font-size:13px;margin-top:2px}.hitems{font-size:14px;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:30px 0;font-size:40px}.empty p{font-size:15px;margin:8px 0 0}
#im{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
#im[hidden]{display:none}
#im:not([hidden]){animation:fade .25s ease}
#im:not([hidden]) .sheet{animation:sheet .4s cubic-bezier(.2,.9,.25,1)}
#imgout{width:100%;border-radius:12px;display:block}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.acts .btn{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;font-size:14px}
.acts .btn i{font-style:normal;font-size:20px}
.acts .btn[hidden]{display:none}
</style>
</head>
<body>
<main>
  <div class="top"><div><h1 id="name"></h1></div>
    <div class="lang"><button data-a="lang" data-id="en">EN</button><button data-a="lang" data-id="zh">繁</button><button data-a="lang" data-id="vi">VI</button></div></div>
  <p class="sub" id="tag"></p>
  <div class="tools"><button class="scan" id="scanbtn" data-a="scan"></button><button class="scan" id="histbtn" data-a="hist"></button></div>
  <div id="list"></div>
</main>
<div id="bar" hidden><button id="open"><span id="bc"></span><span id="bt"></span></button></div>
<div id="toast" hidden><span id="tt"></span><button data-a="scan" id="again"></button></div>
<div id="ov" hidden><div class="sheet" id="sheet"></div></div>
<div id="im" hidden><div class="sheet"><h2><span id="imt"></span><button class="x" data-a="imx">✕</button></h2><img id="imgout" alt=""><p class="hint" id="imh"></p></div></div>
<div id="sc" hidden><div class="sheet">
  <h2><span id="sct"></span><button class="x" data-a="scx">✕</button></h2>
  <video id="vid" playsinline muted></video>
  <p class="hint" id="st"></p>
  <label class="l" for="man" id="manlab"></label>
  <div class="manrow"><input id="man" inputmode="numeric" placeholder="4897878000012"><button class="add" data-a="manadd" id="madd"></button></div>
</div></div>

      wrap(x.i.t[lang][0], W - 2 * P - 150, 18, false).forEach((ln, i) => { t(ln, P, "left", 18, false); if (i === 0) t(money(x.q * x.p), W - P, "right", 18, true); y += LH; });
      t(`${x.q} × ${money(x.p)}${x.i.unit ? " / " + x.i.unit[lang] : ""}`, P + 14, "left", 15, false, "#777"); y += LH - 2;
    });
    dash();
    kv(T.count, String(r.items.reduce((a, x) => a + x.q, 0)));
    y += 6; t(T.total, P, "left", 24, true); t(money(r.total), W - P, "right", 24, true); y += 34;
    dash();
    if (draw) { ctx.fillStyle = "#222"; let x = 70, i = 0; while (x < W - 70) { const w = 2 + ((r.ref.charCodeAt(i % r.ref.length) + i * 7) % 3) * 2; ctx.fillRect(x, y, w, 56); x += w + 2 + ((i * 5) % 3) * 2; i++; } }
    y += 82; t(r.ref.split("").join(" "), W / 2, "center", 16, false, "#555"); y += 40;
    t(T.thanks, W / 2, "center", 22, true); y += 34;
    wrap(T.keep, W - 2 * P, 15).forEach(ln => { t(ln, W / 2, "center", 15, false, "#777"); y += 22; });
    t(wn, W / 2, "center", 15, false, "#777"); y += 40;
    return y;
  };
  const H = run(document.createElement("canvas").getContext("2d"), false);
  const c = document.createElement("canvas"); c.width = W * 2; c.height = H * 2;
  const ctx = c.getContext("2d"); ctx.scale(2, 2);
  ctx.fillStyle = "#fffdf7"; ctx.fillRect(0, 0, W, H);
  run(ctx, true);
  return c;
}
function saveImage() {
  $("#imgout").src = receiptCanvas(rc).toDataURL("image/png");
  $("#imt").textContent = S().saveImg; $("#imh").textContent = S().imgHint; $("#im").hidden = false;
}
let dl = null, rcBlob = null;
try { if (window.claude && claude.use) claude.use("downloads").then(x => { dl = x; }).catch(() => {}); } catch (e) {}
function receiptText(r) {
  const T = S(), d = new Date(r.ts), loc = LOC[lang];
  const L2 = (k, v) => `${k}: ${v}`;
  return [CONFIG.shopName.toUpperCase() + " — " + T.rcpt, "",
    L2(T.ref, r.ref), L2(T.date, d.toLocaleDateString(loc, { year: "numeric", month: "short", day: "numeric" })), L2(T.time, d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" })),
    L2(T.nm, r.who), L2(T.pay, r.method.cash ? T.cashRcpt : r.method.label),
    ...(r.via ? [L2(T.notified, T["via" + r.via])] : []), ...(r.remark ? [L2(T.remarks, r.remark)] : []), "",
    ...r.items.map(x => `${x.q}× ${x.i.t[lang][0]}  ${money(x.q * x.p)}`),
    "", L2(T.total, money(r.total)), "", T.thanks].join("\n");
}
function prepBlob() { rcBlob = null; try { receiptCanvas(rc).toBlob(b => { rcBlob = b; }, "image/png"); } catch (e) {} }
function fname(ext) { return "receipt-" + rc.ref.replace("#", "") + "." + ext; }
function flashBtn(b, txt) { const old = b.innerHTML; b.textContent = txt; setTimeout(() => { b.innerHTML = old; }, 1500); }
async function shareReceipt(b) {
  try {
    if (rcBlob) {
      const file = new File([rcBlob], fname("png"), { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: CONFIG.shopName + " " + rc.ref }); return; }
    }
    if (navigator.share) { await navigator.share({ title: CONFIG.shopName + " " + rc.ref, text: receiptText(rc) }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  copyReceipt(b);
}
async function downloadImage(b) {
  try {
    if (!dl) throw new Error("na");
    const blob = rcBlob || await new Promise(res => receiptCanvas(rc).toBlob(res, "image/png"));
    await dl.save({ filename: fname("png"), data: blob });
    flashBtn(b, S().dlDone);
  } catch (e) { if (e && e.code === "declined") return; flashBtn(b, S().dlFail); }
}
async function copyReceipt(b) {
  try { await navigator.clipboard.writeText(receiptText(rc)); flashBtn(b, S().copied); }
  catch (e) { flashBtn(b, S().copyFail); }
}
function needName(e) {
  if (who) return false;
  e.preventDefault();
  const i = $("#who"), er = $("#werr");
  er.textContent = S().nameReq; er.hidden = false;
  i.classList.remove("shake"); void i.offsetWidth; i.classList.add("shake");
  i.focus(); i.scrollIntoView({ block: "center", behavior: "smooth" });
  return true;
}
function finish() {
  rc = { ref, who, remark: remark.trim(), method: pm(), ts: Date.now(), via, items: lines().map(i => ({ i, q: cart[i.id], p: i.price })), total: total() };
  rc.saved = saveHist(rc); updHist(); fromHist = false; view = "receipt"; renderSheet();
}
function done() {
  Object.keys(cart).forEach(k => delete cart[k]);
  remark = ""; notified = false; via = ""; view = "order"; $("#ov").hidden = true; renderList();
}
function closeSheet() { if (view === "receipt" && !fromHist) done(); else { fromHist = false; $("#ov").hidden = true; } }

function say(t) { $("#st").textContent = t; }
function flash(it) {
  const el = $("#it-" + it.id);
  if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.add("flash"); }
  $("#tt").textContent = S().added(it.t[lang][0], cart[it.id]);
  $("#toast").hidden = false; clearTimeout(toastT);
  toastT = setTimeout(() => { $("#toast").hidden = true; }, 5000);
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
}
function handleCode(raw, manual) {
  const c = String(raw).replace(/\D/g, ""); if (!c) return;
  const now = Date.now();
  if (!manual && c === last && now - lastT < 2500) return;
  last = c; lastT = now;
  const it = ITEMS.find(i => i.code === c);
  if (it) { cart[it.id] = (cart[it.id] || 0) + 1; stopScan(); renderList(); flash(it); }
  else say(S().unknown(c));
}
async function startScan() {
  last = ""; $("#sc").hidden = false; say(S().starting);
  try {
    if (!window.ZXing) throw new Error("no scanner");
    reader = new ZXing.BrowserMultiFormatReader();
    await reader.decodeFromConstraints({ video: { facingMode: "environment" } }, $("#vid"), r => { if (r) handleCode(r.getText()); });
    say(S().point);
  } catch (e) { say(S().noCam); }
}
function stopScan() { try { reader && reader.reset(); } catch (e) {} reader = null; $("#sc").hidden = true; }

function applyLang() {
  const T = S();
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang;
  $("#name").textContent = CONFIG.shopName;
  $("#tag").textContent = T.tag; $("#scanbtn").textContent = T.scan;
  $("#again").textContent = T.again; updHist(); $("#sct").textContent = T.scTitle;
  $("#manlab").textContent = T.typeCode; $("#madd").textContent = T.add;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.id === lang));
  renderList(); if (!$("#ov").hidden) renderSheet();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === "add" || a === "sub") {
    cart[id] = Math.max(0, (cart[id] || 0) + (a === "add" ? 1 : -1)); lastId = id; renderList();
    if (!$("#ov").hidden) renderSheet();
  }
  else if (a === "m") { method = id; payAnim = true; renderSheet(); payAnim = false; }
  else if (a === "close") closeSheet();
  else if (a === "scan") startScan();
  else if (a === "scx") stopScan();
  else if (a === "manadd") { handleCode($("#man").value, true); $("#man").value = ""; }
  else if (a === "copyamt") copy(String(total()), b);
  else if (a === "copyphone") copy(CONFIG.phone, b);
  else if (a === "copymsg") { if (needName(e)) return; notified = true; via = "copy"; $("#fin").hidden = false; copy(message(), b); }
  else if (a === "n") { if (needName(e)) return; notified = true; via = b.id === "wa" ? "wa" : "sms"; $("#fin").hidden = false; }
  else if (a === "finish") finish();
  else if (a === "done") { if (fromHist) { fromHist = false; view = "history"; renderSheet(); } else done(); }
  else if (a === "hist") { view = "history"; fromHist = false; $("#ov").hidden = false; renderSheet(); }
  else if (a === "hopen") { rc = fromRec(hist()[+id]); fromHist = true; view = "receipt"; renderSheet(); }
  else if (a === "hclear") {
    if (!clearArm) { clearArm = true; b.textContent = S().clearSure; setTimeout(() => { clearArm = false; if (view === "history" && !$("#ov").hidden) renderHistory(); }, 3000); }
    else { clearArm = false; try { localStorage.removeItem("shopHist"); } catch (x) {} updHist(); renderHistory(); }
  }
  else if (a === "saveimg") saveImage();
  else if (a === "share") shareReceipt(b);
  else if (a === "dlimg") downloadImage(b);
  else if (a === "copytxt") copyReceipt(b);
  else if (a === "imx") $("#im").hidden = true;
  else if (a === "lang") { lang = id; try { localStorage.setItem("lang", id); } catch (x) {} applyLang(); }
});
$("#open").onclick = () => {
  ref = "#" + Math.random().toString(36).slice(2, 6).toUpperCase();
  view = "order"; notified = false; $("#ov").hidden = false; renderSheet();
};
$("#ov").addEventListener("click", e => { if (e.target.id === "ov") closeSheet(); });
document.addEventListener("input", e => {
  if (e.target.id === "who") { who = e.target.value.trim(); try { localStorage.setItem("shopName", who); } catch (x) {} links(); if (who) $("#werr").hidden = true; }
  else if (e.target.id === "rmk") { remark = e.target.value; links(); }
});
applyLang();
</script>
</body>
